{{ define "admin/users_create.html" }}
{{ template "admin/header.html" . }}

<h2>Create New User</h2>

{{ if .Error }}
    <div class="alert alert-danger error">{{ .Error }}</div>
{{ end }}

<form action="/admin/users" method="POST" class="admin-user-form" novalidate>
    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" value="{{ .Username }}" maxlength="100">
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" maxlength="128">
    </div>

    <div class="mb-3">
        <label for="password_confirm" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="password_confirm" name="password_confirm" maxlength="128">
    </div>

    <button type="submit" class="btn btn-primary">Create User</button>
    <a href="/admin/users" class="btn btn-link">Cancel</a>
</form>

{{ template "admin/footer.html" . }}
{{ end }}
