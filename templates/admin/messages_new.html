{{ define "admin/messages_new.html" }}
{{ template "admin/header.html" . }}

<h2>Create Message</h2>

{{ if .Error }}
    <div class="alert alert-danger error">{{ .Error }}</div>
{{ end }}

<form action="/admin/messages" method="POST" class="admin-message-form" novalidate>
    <div class="mb-3">
        <label for="author" class="form-label">Author (optional)</label>
        <input type="text" class="form-control" id="author" name="author" value="{{ .Author }}" maxlength="100">
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email (optional)</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ .Email }}" maxlength="255">
    </div>

    <div class="mb-3">
        <label for="content" class="form-label">Message</label>
        <textarea class="form-control" id="content" name="content" rows="6" maxlength="5000">{{ .Content }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Create Message</button>
    <a href="/admin/messages" class="btn btn-link">Cancel</a>
</form>

{{ template "admin/footer.html" . }}
{{ end }}
