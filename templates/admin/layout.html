{{ define "admin/header.html" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Go Guestbook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/guestbook.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 admin-nav">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fs-5 admin-nav__brand">Guestbook Admin</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">View Site</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/messages">Messages</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/users">Users</a></li>
                    {{ if .IsDev }}
                    <li class="nav-item"><a class="nav-link" href="/admin/tools">Tools</a></li>
                    {{ end }}
                </ul>
                <form action="/admin/logout" method="POST" class="d-flex">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="container admin">
{{ end }}

{{ define "admin/footer.html" }}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/confirm-delete.js"></script>
</body>
</html>
{{ end }}
